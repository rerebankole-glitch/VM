name: Test and deploy to GitHub Pages

# Runs the test suite for every push and pull request, and publishes the site
# to GitHub Pages. Everything is static — there is no build step.
#
# GitHub offers two ways to publish, and this workflow works with both:
#
#   * Source: "Deploy from a branch" (main / root)
#       → GitHub publishes the repository itself on every push. The workflow
#         runs the tests and reports that publishing already happened.
#   * Source: "GitHub Actions"
#       → the build/deploy jobs below assemble the site (only the files the site
#         needs), so the tests gate the deployment.
#
# See docs/DEPLOY.md for the one-time settings step and troubleshooting.

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22

            # Catalogue/asset/interface checks plus real boots of the bundled
            # images through the vendored emulator (v86's Node mode).
            - name: Run the test suite
              run: npm test

    build:
        name: Build site
        needs: test
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        outputs:
            mode: ${{ steps.pages.outputs.mode }}
        steps:
            - uses: actions/checkout@v4

            - name: Check how GitHub Pages is configured
              id: pages
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  mode="off"
                  if json=$(gh api "repos/${{ github.repository }}/pages" 2>/dev/null); then
                      detected=$(printf '%s' "$json" | sed -n 's/.*"build_type":"\([a-z]*\)".*/\1/p')
                      if [ "$detected" = "workflow" ]; then
                          mode="workflow"
                      else
                          mode="branch"
                      fi
                  fi
                  echo "mode=$mode" >> "$GITHUB_OUTPUT"
                  echo "Detected Pages mode: $mode"
                  case "$mode" in
                      workflow)
                          echo "::notice::GitHub Pages is set to 'GitHub Actions' — this workflow will publish the site." ;;
                      branch)
                          echo "::notice::GitHub Pages publishes the main branch directly, so this push is already live at https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/. Tests still run here; switch Source to 'GitHub Actions' if you would rather have this workflow publish only the site files." ;;
                      *)
                          echo "::warning title=Enable GitHub Pages (one click)::Open Settings → Pages → Build and deployment → Source: 'Deploy from a branch' (main, /) for the simplest setup, or 'GitHub Actions' to let this workflow publish. Then re-run this workflow." ;;
                  esac

            # The remaining steps only run in "GitHub Actions" mode.
            - name: Assemble the static site
              if: steps.pages.outputs.mode == 'workflow'
              run: |
                  mkdir -p _site
                  cp -r index.html app assets docs _site/
                  cp .nojekyll _site/.nojekyll
                  cp LICENSE NOTICE README.md _site/
                  du -sh _site
                  find _site -maxdepth 2 -type d | sort

            - uses: actions/configure-pages@v5
              if: steps.pages.outputs.mode == 'workflow'

            - name: Upload the site
              if: steps.pages.outputs.mode == 'workflow'
              uses: actions/upload-pages-artifact@v3
              with:
                  path: _site

    deploy:
        name: Deploy
        needs: build
        if: github.event_name != 'pull_request' && needs.build.outputs.mode == 'workflow'
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
