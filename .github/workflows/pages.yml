name: Test and deploy to GitHub Pages

# Publishes the site (everything is static — there is no build step) to GitHub
# Pages, and runs the test suite for pull requests.
#
# One-time setup: repository → Settings → Pages → Build and deployment →
# Source: "GitHub Actions". The workflow also tries to enable Pages by itself
# and prints instructions in the run summary if it is not allowed to.
#
# After that the site lives at https://<owner>.github.io/<repo>/ — see
# docs/DEPLOY.md.

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22

            # The catalogue/asset/interface checks plus real boots of the
            # bundled images through the vendored emulator (Node mode).
            - name: Run the test suite
              run: npm test

    build:
        name: Build site
        needs: test
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            # `enablement: true` lets the first run switch Pages on by itself.
            # When the token is not allowed to do that the job keeps going and
            # the deploy step explains what to click.
            - id: pages
              uses: actions/configure-pages@v5
              with:
                  enablement: true
              continue-on-error: true

            - name: Report whether Pages is enabled
              if: steps.pages.outcome == 'failure'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  ORG="${{ github.repository_owner }}"
                  REPO="${{ github.event.repository.name }}"
                  if gh api "repos/${ORG}/${REPO}/pages" --silent 2>/dev/null; then
                      echo "Pages is enabled — continuing."
                  else
                      echo "::warning title=Enable GitHub Pages (one click)::Open Settings → Pages → Build and deployment → Source: GitHub Actions, then re-run this workflow. The site will appear at https://${ORG}.github.io/${REPO}/"
                  fi

            # Assemble only the files the site needs, so tests and tooling stay
            # out of the published artifact.
            - name: Assemble the static site
              run: |
                  mkdir -p _site
                  cp -r index.html app assets docs _site/
                  cp .nojekyll _site/.nojekyll
                  du -sh _site
                  find _site -maxdepth 2 -type d | sort

            - name: Upload the site
              uses: actions/upload-pages-artifact@v3
              with:
                  path: _site

    deploy:
        name: Deploy
        needs: build
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
