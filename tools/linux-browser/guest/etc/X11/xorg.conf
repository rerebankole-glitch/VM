Section "ServerFlags"
    Option "AutoAddDevices" "true"
    Option "AllowMouseOpenFail" "true"
EndSection
Section "Device"
    Identifier "Framebuffer"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
EndSection
Section "Monitor"
    Identifier "Monitor"
EndSection
Section "Screen"
    Identifier "Screen"
    Device "Framebuffer"
    Monitor "Monitor"
    DefaultDepth 24
EndSection
Section "ServerLayout"
    Identifier "Desktop"
    Screen "Screen"
EndSection
