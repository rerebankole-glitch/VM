Section "ServerFlags"
    Option "AutoAddDevices" "true"
    Option "AllowMouseOpenFail" "true"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection
Section "Device"
    Identifier "Framebuffer"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
    Option "ShadowFB" "true"
EndSection
Section "Monitor"
    Identifier "Monitor"
    DisplaySize 320 180
    Option "DPMS" "false"
EndSection
Section "Screen"
    Identifier "Screen"
    Device "Framebuffer"
    Monitor "Monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1280x720" "1024x576" "1024x768"
    EndSubSection
EndSection
Section "ServerLayout"
    Identifier "Desktop"
    Screen "Screen"
EndSection
