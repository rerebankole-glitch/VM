! WebVM Fluxbox style — dark, wide, a little more “desktop” than stock Flux.
style.name: WebVM
style.author: WebVM
style.date: 2026
style.credits: Fluxbox

menu.roundCorners: none
toolbar.roundCorners: none
window.roundCorners: none

toolbar: flat solid
toolbar.color: #102226
toolbar.borderWidth: 0
toolbar.borderColor: #102226
toolbar.clock: flat solid
toolbar.clock.color: #102226
toolbar.clock.textColor: #8cddba
toolbar.workspace: flat solid
toolbar.workspace.color: #102226
toolbar.workspace.textColor: #d7ece4
toolbar.iconbar.borderWidth: 0
toolbar.iconbar.focused: flat solid
toolbar.iconbar.focused.color: #1c3d36
toolbar.iconbar.focused.textColor: #e8f0ed
toolbar.iconbar.unfocused: flat solid
toolbar.iconbar.unfocused.color: #102226
toolbar.iconbar.unfocused.textColor: #8aa39c
toolbar.button: flat solid
toolbar.button.color: #102226
toolbar.button.picColor: #8cddba
toolbar.button.pressed.color: #1c3d36

window.title.height: 22
window.justify: left
window.borderWidth: 1
window.borderColor: #2a4a44
window.bevelWidth: 0
window.handleWidth: 3

window.title.focus: flat solid
window.title.focus.color: #16332e
window.title.unfocus: flat solid
window.title.unfocus.color: #102226
window.label.focus: flat solid
window.label.focus.color: #16332e
window.label.focus.textColor: #e8f0ed
window.label.unfocus: flat solid
window.label.unfocus.color: #102226
window.label.unfocus.textColor: #7f9891

window.button.focus: flat solid
window.button.focus.color: #16332e
window.button.focus.picColor: #8cddba
window.button.unfocus: flat solid
window.button.unfocus.color: #102226
window.button.unfocus.picColor: #5d756e
window.button.pressed.color: #8cddba
window.button.pressed.picColor: #102226

window.handle.focus: flat solid
window.handle.focus.color: #16332e
window.handle.unfocus: flat solid
window.handle.unfocus.color: #102226
window.grip.focus: flat solid
window.grip.focus.color: #2a6b5c
window.grip.unfocus: flat solid
window.grip.unfocus.color: #102226

menu.borderWidth: 1
menu.borderColor: #2a4a44
menu.bevelWidth: 0
menu.title: flat solid
menu.title.color: #16332e
menu.title.textColor: #8cddba
menu.title.justify: center
menu.frame: flat solid
menu.frame.color: #102226
menu.frame.textColor: #d7ece4
menu.frame.disableColor: #5d756e
